	<body>
	<form>
		<fieldset id="registration_fieldset"><legend id="fieldset_name">Регистрация</legend>
		<div class="registration">
		<label for="userName" class="registration_label" required>Потребителско име</label>
		<input type="text" name="userName" class="registration_input" maxlength="35">
		<label for="password" class="registration_label" required>Парола</label>
		<input type="password" name="password" class="registration_input" maxlength="15">
		</div>
		<div class="registration2">
		<label for="email" class="registration_label" required>Имейл</label>
		<input type="text" name="email" class="registration_input">
		<label for="number" class="registration_label" required>Телефонен номер</label>
		<input type="password" name="number" class="registration_input" maxlength="13">
		</div>
		<div class="button">
		<input type="submit"  value="Вход">
		<input type="reset"  value="Изчисти">
		</div>
		</fieldset>
	</form>
